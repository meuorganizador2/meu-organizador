<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Organizador</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#10131a);--surface:light-dark(#fff,#181c25);--surface2:light-dark(#f0f3f8,#222733);--text:light-dark(#172033,#f4f6fb);--muted:light-dark(#6b7485,#aeb6c7);--accent:#7567e8;--accent2:#e8e4ff;--danger:#df5b69;--success:#35a77a;--border:light-dark(#e3e7ef,#303747)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}
header{padding:28px 5vw 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:-1px}.sub{color:var(--muted);margin-top:5px}.clock{background:var(--surface);border:1px solid var(--border);padding:12px 16px;border-radius:16px;text-align:right;min-width:170px}.clock b{font-size:22px;display:block}.clock span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;overflow:auto;padding:0 5vw 16px}nav button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:12px;white-space:nowrap;cursor:pointer}nav button.active{background:var(--accent);border-color:var(--accent);color:white}
main{padding:0 5vw 40px;max-width:1250px;margin:auto}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(20,30,60,.05)}.metric{min-height:125px}.metric .icon{font-size:24px}.metric strong{display:block;font-size:25px;margin-top:10px}.metric small{color:var(--muted)}
.sectiongrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.title h2{font-size:18px;margin:0}.btn{border:0;background:var(--accent);color:#fff;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:650}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:13px;background:var(--surface2)}.item .left{display:flex;gap:11px;align-items:center}.badge{font-size:12px;padding:5px 8px;border-radius:8px;background:var(--accent2);color:#5a4fd0}.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form .full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:grid;gap:5px}input,select,textarea{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:11px;font:inherit}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;margin-top:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--border);font-size:14px}.table th{color:var(--muted);font-size:12px}.positive{color:var(--success)}.negative{color:var(--danger)}.empty{padding:25px;text-align:center;color:var(--muted)}
.quote{font-size:18px;line-height:1.55}.datebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:65px;padding:7px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);font-size:12px}.day.today{outline:2px solid var(--accent)}.day .dot{display:block;margin-top:6px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.sectiongrid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .full{grid-column:auto}header{align-items:flex-start;flex-direction:column}.clock{width:100%;text-align:left}.calendar .day{min-height:55px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.metric strong{font-size:20px}main{padding:0 4vw 30px}header{padding:22px 4vw 14px}nav{padding-left:4vw;padding-right:4vw}}
</style></head>
<body><div id="app">
<header><div><h1>Meu Organizador ✨</h1><div class="sub">Sua rotina, seus compromissos e suas finanças em um só lugar.</div></div><div class="clock"><b id="clock">--:--:--</b><span id="todayText">--</span></div></header>
<nav id="nav"></nav><main id="main"></main>
</div>
<script>
const key='meu-organizador-v1';
let db=JSON.parse(localStorage.getItem(key)||'null')||{events:[],debts:[],cards:[],incomes:[],shopping:[],prayers:[],expenses:[]};
const save=()=>localStorage.setItem(key,JSON.stringify(db));
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';
const todayISO=()=>{let d=new Date();return d.toISOString().slice(0,10)};
function clock(){let d=new Date();document.querySelector('#clock').textContent=d.toLocaleTimeString('pt-BR');document.querySelector('#todayText').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});};setInterval(clock,1000);clock();
const tabs=[['home','🏠 Início'],['agenda','📅 Agenda'],['financas','💰 Finanças'],['compras','🛒 Compras'],['oracoes','🙏 Orações']];
let current='home';
function nav(){document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${x[0]===current?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(v){current=v;nav();render()}
function add(type,obj){db[type].push({id:Date.now(),...obj});save();render()}
function del(type,id){db[type]=db[type].filter(x=>x.id!==id);save();render()}
function render(){let m=document.querySelector('#main');if(current==='home')home(m);if(current==='agenda')agenda(m);if(current==='financas')financas(m);if(current==='compras')compras(m);if(current==='oracoes')oracoes(m)}
function home(m){let income=db.incomes.reduce((s,x)=>s+Number(x.valor),0), exp=db.expenses.reduce((s,x)=>s+Number(x.valor),0), due=db.debts.filter(x=>x.status!=='Pago').reduce((s,x)=>s+Number(x.valor),0), ev=db.events.filter(x=>x.data>=todayISO()).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,4);m.innerHTML=`<div class="grid"><div class="card metric"><div class="icon">📅</div><strong>${db.events.length}</strong><small>eventos cadastrados</small></div><div class="card metric"><div class="icon">💵</div><strong>${money(income-exp)}</strong><small>saldo registrado</small></div><div class="card metric"><div class="icon">⏰</div><strong>${money(due)}</strong><small>contas a pagar</small></div><div class="card metric"><div class="icon">🛒</div><strong>${db.shopping.filter(x=>!x.ok).length}</strong><small>itens para comprar</small></div></div><div class="sectiongrid"><div class="card"><div class="title"><h2>Próximos eventos</h2><button class="btn" onclick="go('agenda')">Adicionar</button></div>${ev.length?`<div class="list">${ev.map(x=>`<div class="item"><div class="left"><span class="badge">${fmtDate(x.data)}</span><div><b>${x.titulo}</b><div class="muted">${x.hora||''} ${x.local?'• '+x.local:''}</div></div></div></div>`).join('')}</div>`:'<div class="empty">Nenhum evento próximo.</div>'}</div><div class="card"><div class="title"><h2>🙏 Lembrete de hoje</h2></div><p class="quote">${db.prayers[0]?.texto||'“Que meu dia seja guiado por paz, gratidão e sabedoria.”'}</p><button class="btn secondary" onclick="go('oracoes')">Ver orações</button></div></div>`}
function agenda(m){let month=new Date().getMonth(),year=new Date().getFullYear(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=db.events.filter(x=>x.data===iso);cells+=`<div class="day ${iso===todayISO()?'today':''}"><b>${d}</b>${ev.map(x=>`<span class="dot">• ${x.hora||''} ${x.titulo}</span>`).join('')}</div>`}m.innerHTML=`<div class="sectiongrid"><div class="card"><div class="datebar"><h2>Calendário — ${new Date(year,month).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2></div><div class="week">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar">${cells}</div></div><div class="card"><div class="title"><h2>Novo evento</h2></div><form onsubmit="event.preventDefault();add('events',{titulo:this.titulo.value,data:this.data.value,hora:this.hora.value,local:this.local.value})"><div class="form"><label class="full">Evento<input name="titulo" required placeholder="Ex.: reunião, aniversário, consulta"></label><label>Data<input name="data" type="date" required></label><label>Hora<input name="hora" type="time"></label><label class="full">Local<input name="local" placeholder="Opcional"></label></div><div class="actions"><button class="btn">Salvar evento</button></div></form><hr style="border:0;border-top:1px solid var(--border);margin:18px 0">${db.events.sort((a,b)=>a.data.localeCompare(b.data)).map(x=>`<div class="item" style="margin-bottom:8px"><div><b>${x.titulo}</b><div class="muted">${fmtDate(x.data)} ${x.hora||''}</div></div><button class="btn secondary" onclick="del('events',${x.id})">Excluir</button></div>`).join('')||'<div class="empty">Cadastre seu primeiro evento.</div>'}</div></div>`}
function financas(m){let income=db.incomes.reduce((s,x)=>s+Number(x.valor),0),exp=db.expenses.reduce((s,x)=>s+Number(x.valor),0);m.innerHTML=`<div class="grid"><div class="card metric"><div>💵</div><strong class="positive">${money(income)}</strong><small>salários/entradas</small></div><div class="card metric"><div>📤</div><strong class="negative">${money(exp)}</strong><small>despesas registradas</small></div><div class="card metric"><div>📊</div><strong>${money(income-exp)}</strong><small>saldo</small></div><div class="card metric"><div>💳</div><strong>${money(db.cards.reduce((s,x)=>s+Number(x.valor),0))}</strong><small>faturas de cartões</small></div></div><div class="sectiongrid"><div class="card"><div class="title"><h2>Contas e dívidas</h2></div>${db.debts.map(x=>`<div class="item" style="margin-bottom:8px"><div><b>${x.nome}</b><div class="muted">Vencimento: ${fmtDate(x.data)} • ${x.status||'Pendente'}</div></div><strong>${money(x.valor)}</strong></div>`).join('')||'<div class="empty">Nenhuma conta cadastrada.</div>'}<form onsubmit="event.preventDefault();add('debts',{nome:this.nome.value,data:this.data.value,valor:this.valor.value,status:'Pendente'})" style="margin-top:15px"><div class="form"><label>Quem/conta<input name="nome" required placeholder="Ex.: João, internet, aluguel"></label><label>Vencimento<input name="data" type="date" required></label><label>Valor<input name="valor" type="number" step="0.01" required></label></div><div class="actions"><button class="btn">Adicionar conta</button></div></form></div><div class="card"><div class="title"><h2>Registrar salário ou despesa</h2></div><form onsubmit="event.preventDefault();let type=this.tipo.value==='entrada'?'incomes':'expenses';add(type,{nome:this.nome.value,valor:this.valor.value,data:this.data.value})"><div class="form"><label>Tipo<select name="tipo"><option value="entrada">Salário / entrada</option><option value="saida">Despesa</option></select></label><label>Valor<input name="valor" type="number" step="0.01" required></label><label class="full">Descrição<input name="nome" placeholder="Ex.: salário de outubro"></label><label>Data<input name="data" type="date" value="${todayISO()}"></label></div><div class="actions"><button class="btn">Registrar</button></div></form><hr style="border:0;border-top:1px solid var(--border);margin:18px 0"><h3>Cartões de crédito</h3>${db.cards.map(x=>`<div class="item" style="margin-bottom:8px"><div><b>${x.nome}</b><div class="muted">Vencimento ${fmtDate(x.data)}</div></div><strong>${money(x.valor)}</strong></div>`).join('')||'<div class="empty">Cadastre suas faturas aqui.</div>'}<form onsubmit="event.preventDefault();add('cards',{nome:this.nome.value,data:this.data.value,valor:this.valor.value})" style="margin-top:15px"><div class="form"><label>Cartão<input name="nome" required placeholder="Ex.: Nubank"></label><label>Fatura<input name="valor" type="number" step="0.01" required></label><label>Dia/data de pagamento<input name="data" type="date" required></label></div><div class="actions"><button class="btn secondary">Adicionar cartão</button></div></form></div></div>`}
function compras(m){m.innerHTML=`<div class="sectiongrid"><div class="card"><div class="title"><h2>Lista de compras</h2></div><form onsubmit="event.preventDefault();add('shopping',{nome:this.nome.value,quantidade:this.quantidade.value,ok:false})"><div class="form"><label>O que comprar<input name="nome" required placeholder="Ex.: arroz, material, remédio"></label><label>Quantidade<input name="quantidade" placeholder="1"></label></div><div class="actions"><button class="btn">Adicionar à lista</button></div></form><div class="list" style="margin-top:16px">${db.shopping.map(x=>`<div class="item"><label style="display:flex;align-items:center;gap:10px;color:var(--text);font-size:14px"><input type="checkbox" ${x.ok?'checked':''} onchange="db.shopping.find(y=>y.id===${x.id}).ok=this.checked;save();render()"> <span style="text-decoration:${x.ok?'line-through':'none'}">${x.nome} <span class="muted">(${x.quantidade||1})</span></span></label><button class="btn secondary" onclick="del('shopping',${x.id})">Excluir</button></div>`).join('')||'<div class="empty">Sua lista está vazia.</div>'}</div></div><div class="card"><h2>💡 Dica</h2><p class="muted">Use esta área para lembrar compras do mês, itens para casa, materiais de trabalho ou presentes. Os dados ficam salvos neste navegador.</p></div></div>`}
function oracoes(m){m.innerHTML=`<div class="sectiongrid"><div class="card"><div class="title"><h2>🙏 Orações diárias</h2></div>${db.prayers.map((x,i)=>`<div class="item" style="margin-bottom:9px;align-items:flex-start"><div><b>${x.titulo}</b><p class="muted" style="white-space:pre-wrap;margin:7px 0 0">${x.texto}</p></div><button class="btn secondary" onclick="del('prayers',${x.id})">Excluir</button></div>`).join('')||'<div class="empty">Adicione uma oração, reflexão ou intenção diária.</div>'}</div><div class="card"><h2>Adicionar oração</h2><form onsubmit="event.preventDefault();add('prayers',{titulo:this.titulo.value,texto:this.texto.value})"><label>Título<input name="titulo" required placeholder="Ex.: Oração da manhã"></label><label style="margin-top:10px">Texto<textarea name="texto" required placeholder="Escreva sua oração ou reflexão..."></textarea></label><div class="actions"><button class="btn">Salvar oração</button></div></form></div></div>`}
nav();render();
</script></body></html>
